<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShell Web Terminal</title>
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: monospace;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

    <!-- Xterm.js Core & Fit Addon -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <script>
        // 1. Prompt user for the active Cloudflare Tunnel URL
        let serverUrl = prompt("Enter your Cloudflare Tunnel URL (e.g., https://xxx.trycloudflare.com):");
        if (serverUrl) {
            serverUrl = serverUrl.trim().replace(/\/$/, ""); // Remove trailing slash
        }

        // 2. Initialize Xterm.js Terminal
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000000',
                foreground: '#00FF00',
                cursor: '#00FF00',
                selectionBackground: 'rgba(0, 255, 0, 0.3)'
            },
            fontFamily: 'Consolas, "Courier New", monospace',
            fontSize: 14
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        term.open(container);
        fitAddon.fit();

        window.addEventListener('resize', () => fitAddon.fit());

        if (!serverUrl) {
            term.writeln("\x1b[31m[!] Error: No server URL provided. Refresh page to try again.\x1b[0m");
        } else {
            term.writeln(`\x1b[32mNetShell Web v1.0 - Connected to: ${serverUrl}\x1b[0m`);
            term.writeln("Type commands below. They will be queued and executed on the device.\r\n");
            term.write("$ ");
        }

        let currentInput = "";

        // 3. Handle Keyboard Input (SSH-like interactive feel)
        term.onKey(({ key, domEvent }) => {
            if (!serverUrl) return;

            const printable = !domEvent.altKey && !domEvent.ctrlKey && !domEvent.metaKey;

            if (domEvent.keyCode === 13) { // Enter key
                term.writeln('');
                const cmd = currentInput.trim();
                currentInput = "";

                if (cmd.length > 0) {
                    executeRemoteCommand(serverUrl, cmd);
                } else {
                    term.write("$ ");
                }
            } else if (domEvent.keyCode === 8) { // Backspace
                if (currentInput.length > 0) {
                    currentInput = currentInput.slice(0, -1);
                    term.write('\b \b');
                }
            } else if (printable) {
                currentInput += key;
                term.write(key);
            }
        });

        // 4. API Communication Loop (Push & Poll Result)
        async function executeRemoteCommand(baseUrl, command) {
            try {
                term.writeln("\x1b[90m[Sending command to queue...]\x1b[0m");
                
                // Step A: Push command to server
                let pushRes = await fetch(`${baseUrl}/api/push`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });

                if (!pushRes.ok) {
                    term.writeln(`\x1b[31m[!] Failed to push command (HTTP ${pushRes.status})\x1b[0m\n$ `);
                    return;
                }

                term.writeln("\x1b[90m[Waiting for device execution...]\x1b[0m");

                // Step B: Poll for output until it's populated (timeout after 20s)
                let attempts = 0;
                let outputFound = false;

                while (attempts < 20 && !outputFound) {
                    await new Promise(r => setTimeout(r, 1000)); // wait 1s per poll
                    
                    try {
                        let outRes = await fetch(`${baseUrl}/api/output`);
                        let outJson = await outRes.json();

                        if (outJson.result !== null && outJson.result !== undefined) {
                            outputFound = true;
                            // Clean line breaks for proper terminal rendering
                            let formattedOutput = outJson.result.replace(/\n/g, '\r\n');
                            term.write(formattedOutput);
                            if (!formattedOutput.endsWith('\r\n')) {
                                term.writeln('');
                            }
                        }
                    } catch (err) {
                        // Network jitter during polling can be retried
                    }
                    attempts++;
                }

                if (!outputFound) {
                    term.writeln("\x1b[33m[!] Timeout: Device did not respond or poll output was null.\x1b[0m");
                }

            } catch (error) {
                term.writeln(`\x1b[31m[!] Network Error: ${error.message}\x1b[0m`);
            }

            term.write("$ ");
        }
    </script>
</body>
</html>
