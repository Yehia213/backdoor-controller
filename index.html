<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Root Controller</title>
    <!-- Free public PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: monospace; background: #0d1117; color: #58a6ff; padding: 20px; }
        .box { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 6px; max-width: 700px; margin: auto; }
        input, button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px; margin: 5px 0; border-radius: 4px; }
        button { cursor: pointer; background: #238636; color: white; border: none; }
        button:hover { background: #2ea043; }
        pre { background: #0d1117; padding: 15px; border: 1px solid #30363d; height: 250px; overflow-y: scroll; color: #7ee787; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Android Root P2P Dashboard</h2>
        <p>Status: <span id="status" style="color: #f85149;">Waiting for connection...</span></p>
        <div>
            <input type="text" id="targetId" placeholder="Enter Android Peer ID" style="width: 70%;">
            <button onclick="connectToPhone()">Connect</button>
        </div>
        <br>
        <div>
            <input type="text" id="commandInput" placeholder="Enter root command (e.g., ls -la)" style="width: 75%;">
            <button onclick="sendCommand()">Execute</button>
        </div>
        <h3>Output Log:</h3>
        <pre id="outputLog">Dashboard ready. Waiting for phone ID...</pre>
    </div>

    <script>
        let peer = new Peer(); // Connects to free public PeerJS cloud
        let conn;
        const log = (msg) => { document.getElementById('outputLog').innerText += "\n" + msg; };

        peer.on('open', (id) => {
            log("Browser Dashboard ID: " + id);
        });

        function connectToPhone() {
            const id = document.getElementById('targetId').value;
            log("Connecting to phone ID: " + id + "...");
            conn = peer.connect(id);

            conn.on('open', () => {
                document.getElementById('status').style.color = "#3fb950";
                document.getElementById('status').innerText = "Connected directly to phone!";
                log("P2P Data channel active.");
            });

            conn.on('data', (data) => {
                log("Response:\n" + data);
            });
        }

        function sendCommand() {
            const cmd = document.getElementById('commandInput',).value;
            if (conn && conn.open) {
                log("> " + cmd);
                conn.send(cmd);
                document.getElementById('commandInput').value = "";
            } else {
                alert("Connection is not active!");
            }
        }
    </script>
</body>
</html>
